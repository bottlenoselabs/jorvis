name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Jorvis.slnx

      - name: Build
        run: dotnet build src/Jorvis.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test --solution src/Jorvis.slnx --no-build --configuration Release

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: docker compose build
