map $http_cf_connecting_ip $jorvis_client_ip {
    default $remote_addr;
    "~."    $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $jorvis_scheme {
    default $scheme;
    "https" "https";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    # Keep redirects relative so they work on any host or port (localhost:5200, the tunnel domain).
    absolute_redirect off;
    client_max_body_size 1m;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types application/octet-stream application/wasm text/javascript application/javascript text/css application/json;

    # Asks the API whether the request carries a valid session. Used to gate the app files themselves, so the compiled
    # frontend is not even downloadable without signing in. The API still enforces access on every request.
    location = /_session {
        internal;
        proxy_pass http://jorvis-api:8080/api/auth/session;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Short links to the Sign In and Join pages; browsers keep the #token fragment through the redirect.
    location ~ ^/(sign-in|join)$ {
        return 302 /auth/$1;
    }

    # The .NET runtime files carry a content hash in their name (dotnet.oii7eopbjg.js), so a changed file has a new name
    # and these can be cached for good: returning visitors make no request for them at all.
    location ~ "^/auth/_framework/.+\.[a-z0-9]{10}\.(js|wasm|dat|json)$" {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/auth-csp.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The Sign In and Join app: public, and separate from the main app so that signed-out visitors never download it.
    location /auth/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/auth-csp.conf;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ /auth/index.html;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        proxy_pass http://jorvis-api:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    # Like the Sign In app's runtime files: the content hash is in the name, so these can be cached for good. The
    # session is still checked, and "private" keeps shared caches from storing them.
    location ~ "^/_framework/.+\.[a-z0-9]{10}\.(js|wasm|dat|json)$" {
        auth_request /_session;
        error_page 401 = @sign_in;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/app-csp.conf;
        add_header Cache-Control "private, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        auth_request /_session;
        error_page 401 = @sign_in;

        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/app-csp.conf;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    location @sign_in {
        return 302 /auth/sign-in;
    }
}
