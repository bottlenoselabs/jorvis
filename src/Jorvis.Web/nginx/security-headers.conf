# Included by every location that sets its own Content-Security-Policy (add_header does not inherit across levels).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Ignored over plain http, so harmless on localhost. No includeSubDomains: other subdomains are not Jorvis's to decide.
add_header Strict-Transport-Security "max-age=31536000" always;
