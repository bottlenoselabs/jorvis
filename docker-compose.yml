name: jorvis

services:
  jorvis-postgres:
    image: postgres:17-alpine
    container_name: jorvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jorvis
      POSTGRES_USER: jorvis
      POSTGRES_PASSWORD: jorvis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - jorvis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jorvis -d jorvis"]
      interval: 5s
      timeout: 5s
      retries: 10

  jorvis-api:
    build:
      context: .
      dockerfile: src/Jorvis.Api/Dockerfile
    container_name: jorvis-api
    restart: unless-stopped
    depends_on:
      jorvis-postgres:
        condition: service_healthy
    environment:
      # Production unless overridden, e.g. `JORVIS_ENVIRONMENT=Development ./start.sh`.
      ASPNETCORE_ENVIRONMENT: "${JORVIS_ENVIRONMENT:-Production}"
      # "Gss Encryption Mode=Disable": we never use Kerberos, and the default probe for it prints a library error.
      ConnectionStrings__Database: "Host=jorvis-postgres;Port=5432;Database=jorvis;Username=jorvis;Password=jorvis;Gss Encryption Mode=Disable"
      # Used to build invite links; set JORVIS_PUBLIC_URL (shell or .env file) to your tunnel address.
      Jorvis__PublicBaseUrl: "${JORVIS_PUBLIC_URL:-http://localhost:5200}"
      # Cookie-encryption keys survive restarts, so people stay signed in.
      DataProtection__KeysPath: /keys
    ports:
      - "127.0.0.1:5117:8080"
    volumes:
      - jorvis-api-keys:/keys
    # The runtime image has no curl or wget, so probe /health over a raw TCP connection with bash.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  jorvis-web:
    build:
      context: .
      dockerfile: src/Jorvis.Web/Dockerfile
    container_name: jorvis-web
    restart: unless-stopped
    depends_on:
      jorvis-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:5200:80"

  jorvis-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: jorvis-tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    # Run as the host user so a mode-600 token file is readable on Linux and macOS.
    user: "${JORVIS_UID:-65532}:${JORVIS_GID:-65532}"
    command: tunnel --no-autoupdate run --token-file /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    depends_on:
      - jorvis-web

secrets:
  cloudflare_tunnel_token:
    file: ${JORVIS_CLOUDFLARE_TUNNEL_TOKEN_FILEPATH:-${HOME}/.config/jorvis/cloudflare-tunnel-token}

volumes:
  jorvis-postgres-data:
  jorvis-api-keys:
